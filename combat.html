<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deathwatch Combat Calculator</title>
<style>
:root{--bg:#fff;--fg:#333;--head:#222E33;--stripe:#E1ECF0;--accent:#E3510E;--line:#BBB;--in:#fff;--good:#1b7a3a;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#161c1f;--fg:#d5dde0;--head:#E1ECF0;--stripe:#222E33;--line:#4a575c;--in:#1e2629;--good:#5ac47f;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.4 'Crimson Pro','Book Antiqua',Palatino,serif}
main{max-width:860px;margin:0 auto;padding:12px 16px 40px}
h1,h2,h3{font-family:Oswald,Impact,sans-serif;color:var(--head);text-transform:uppercase;margin:0}
h1{font-size:28px;margin:8px 0}
h2{font-size:20px;margin:22px 0 8px;padding-top:8px;border-top:3px solid var(--stripe)}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1}
button,select,input{font:inherit;color:var(--fg);background:var(--in);border:1px solid var(--line);padding:8px;min-height:40px;border-radius:0}
button{cursor:pointer;font-weight:bold}
button.on,button.go{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:block;font-size:14px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
input,select{width:100%}
.chk{display:flex;align-items:center;gap:8px;text-transform:none;font-size:16px;margin:0;min-height:40px}
.chk input{width:auto;min-height:0}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 14px}
#out{margin-top:16px;border-left:4px solid var(--accent);background:var(--stripe);padding:10px 14px}
#out p{margin:6px 0}
.hit{color:var(--good);font-weight:bold}.miss{color:var(--bad);font-weight:bold}
table{border-collapse:collapse;width:100%;margin:6px 0}
td,th{border:1px solid var(--line);padding:4px 8px;text-align:left}
small{opacity:.75}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Deathwatch Combat Calculator</h1>
<h2 id="wname" style="border-top:0;margin:8px 0 0"></h2><small>Enter your numbers, roll real dice (or leave them blank for virtual dice) and calculate.</small>

<div class="tabs" role="tablist">
<button type="button" id="tm" class="on" role="tab">Melee</button>
<button type="button" id="tr" role="tab">Ranged</button>
</div>

<h2>Attacker</h2>
<div class="grid">
<div><label for="skill" id="skl">Weapon Skill</label><input type="number" id="skill" min="1" max="100" inputmode="numeric"></div>
<div id="sbw"><label for="sb">Strength Bonus</label><input type="number" id="sb" min="0" inputmode="numeric"></div>
<div><label for="dn">Damage dice</label><input type="number" id="dn" min="1" value="1" inputmode="numeric"></div>
<div><label for="df">Die type</label><select id="df"><option value="5">D5</option><option value="10" selected>D10</option></select></div>
<div><label for="dk">Weapon bonus (+)</label><input type="number" id="dk" value="0" inputmode="numeric"></div>
<div><label for="pen">Penetration</label><input type="number" id="pen" min="0" value="0" inputmode="numeric"></div>
</div>
<div class="grid" style="margin-top:10px">
<div id="rofw" hidden><label for="rof">Fire mode</label><select id="rof"></select></div>
<div id="rofsw" hidden><label for="rofs">RoF: Semi / Full</label>
<div style="display:flex;gap:6px"><input type="number" id="rofs" min="0" value="3" aria-label="Semi-auto RoF"><input type="number" id="roff" min="0" value="6" aria-label="Full-auto RoF"></div></div>
<div><label for="dmgtype">Damage type</label><select id="dmgtype"><option>Impact</option><option>Energy</option><option>Rending</option><option>Explosive</option></select></div>
<div><label for="qual">Weapon quality</label><select id="qual"><option value="">Standard</option><option value="best">Best (+10)</option><option value="good">Good</option><option value="poor">Poor (jams)</option></select></div>
</div>

<h2>Modifiers</h2>
<div class="mods" id="modsM"></div>
<div class="mods" id="modsR" hidden></div>
<div class="grid" style="margin-top:10px">
<div><label for="size">Target size</label><select id="size">
<option value="0">Average (+0)</option><option value="-20">Puny (-20)</option><option value="-10">Scrawny (-10)</option><option value="10">Hulking (+10)</option><option value="20">Enormous (+20)</option><option value="30">Massive (+30)</option><option value="40">Immense (+40)</option><option value="50">Monumental (+50)</option></select></div>
<div id="rngw" hidden><label for="range">Range</label><select id="range">
<option value="30">Point blank (+30)</option><option value="10">Short (+10)</option><option value="0" selected>Normal (+0)</option><option value="-10">Long (-10)</option><option value="-30">Extreme (-30)</option></select></div>
<div><label for="cust">Other modifier</label><input type="number" id="cust" value="0" inputmode="numeric"></div>
</div>

<h2>Target</h2>
<div class="grid">
<div><label for="tb">Toughness Bonus</label><input type="number" id="tb" min="0" value="0" inputmode="numeric"></div>
<div><label for="arm">Armour (hit location)</label><input type="number" id="arm" min="0" value="0" inputmode="numeric"></div>
<div><label for="tbm">Unnatural T multiplier</label><select id="tbm"><option value="1">None (x1)</option><option value="2">x2</option><option value="3">x3</option><option value="4">x4</option></select></div>
</div>

<h2>Dice</h2>
<div class="grid">
<div><label for="roll">D100 attack roll</label><input type="number" id="roll" min="1" max="100" placeholder="blank = roll for me" inputmode="numeric"></div>
<div><label for="dmg">Damage roll per hit (total)</label><input type="text" id="dmg" placeholder="blank = roll for me; commas for several hits" inputmode="numeric"></div>
</div>
<div class="mods"><label class="chk"><input type="checkbox" id="rfm">A damage die showed a 10 (Righteous Fury, manual rolls)</label></div>
<p><button type="button" class="go" id="go" style="width:100%">Calculate</button></p>
<div id="out" hidden aria-live="polite"></div>
</main>
<script>
const $=i=>document.getElementById(i);
let mode="m";

const MELEE=[["Standard attack (+10)",10,0],["Charge (+20)",20,0],["Called shot (-20)",-20,0],["All-out attack (+30)",30,0],["Defensive stance (-10)",-10,0],["Outnumbering (+10)",10,0],["Target prone (+10)",10,0],["Target stunned / unaware (+30)",30,0],["Target helpless (+60)",60,0],["Poor light / vision (-10)",-10,0],["Off-hand weapon (-20)",-20,0]];
const RANGED=[["Aim, half action (+10)",10,"a"],["Aim, full action (+20)",20,"a"],["Called shot (-20)",-20,0],["Target prone (-10)",-10,0],["Target stunned / unaware (+30)",30,0],["Target helpless (+60)",60,0],["Target running / evading (-20)",-20,0],["Firing at target in melee (-20)",-20,0],["Poor light / vision (-10)",-10,0],["Off-hand weapon (-20)",-20,0],["Twin-linked / suppression ignored",0,0]];
function build(id,list){
  $(id).innerHTML=list.filter(m=>m[1]).map((m,i)=>`<label class="chk"><input type="checkbox" data-v="${m[1]}" data-g="${m[2]||""}" data-n="${m[0].replace(/ \(.*/,"")}">${m[0]}</label>`).join("");
}
build("modsM",MELEE);build("modsR",RANGED);
document.addEventListener("change",e=>{ // aim options are exclusive
  const t=e.target;if(t.dataset&&t.dataset.g&&t.checked)document.querySelectorAll('[data-g="a"]').forEach(x=>{if(x!==t)x.checked=false});
});

function setMode(m){
  mode=m;
  $("tm").classList.toggle("on",m==="m");$("tr").classList.toggle("on",m==="r");
  $("modsM").hidden=m!=="m";$("modsR").hidden=m!=="r";
  $("sbw").hidden=m!=="m";$("rngw").hidden=m!=="r";$("rofw").hidden=$("rofsw").hidden=m!=="r";
  $("skl").textContent=m==="m"?"Weapon Skill":"Ballistic Skill";
  $("out").hidden=true;
  if(m==="r")fillRof();
}
function fillRof(){
  const s=$("rof").value;
  $("rof").innerHTML=`<option value="s">Single shot</option><option value="b">Semi-auto burst</option><option value="a">Full auto</option>`;
  if(s)$("rof").value=s;
}
$("tm").onclick=()=>setMode("m");$("tr").onclick=()=>setMode("r");

const d=n=>1+Math.floor(Math.random()*n);
const sgn=v=>(v>=0?"+ ":"&minus; ")+Math.abs(v);
function loc(r){
  const rev=r===100?0:(r%10)*10+Math.floor(r/10); // reversed digits; 100 -> 00
  if(rev<=10&&rev>=1)return "Head";
  if(rev<=20)return "Right Arm";
  if(rev<=30)return "Left Arm";
  if(rev<=70)return "Body";
  if(rev<=85)return "Right Leg";
  return "Left Leg";
}

function num(id,def=0){const v=parseInt($(id).value);return isNaN(v)?def:v}

$("go").onclick=()=>{
  const o=$("out"),skill=num("skill");o.hidden=false;
  if(!skill){o.innerHTML="Enter your "+(mode==="m"?"Weapon":"Ballistic")+" Skill.";return}
  let r=parseInt($("roll").value),virtual=false;
  if(isNaN(r)){r=d(100);virtual=true}
  if(r<1||r>100){o.innerHTML="D100 roll must be 1-100.";return}

  const mods=[];
  document.querySelectorAll("#"+(mode==="m"?"modsM":"modsR")+" input:checked").forEach(c=>mods.push([c.dataset.n,+c.dataset.v]));
  const sz=num("size");if(sz)mods.push(["Size",sz]);
  const cu=num("cust");if(cu)mods.push(["Other",cu]);
  let fire="s";
  if(mode==="r"){
    const rg=num("range");if(rg)mods.push(["Range",rg]);
    fire=$("rof").value;
    if(fire==="b")mods.push(["Semi-auto",10]);
    if(fire==="a")mods.push(["Full auto",-10]);
    if(fire==="s")mods.push(["Single shot",10]);
  }
  const q=$("qual").value;
  if(q==="good"&&mode==="r")mods.push(["Good quality",5]);
  if(q==="best")mods.push(["Best quality",10]);
  let target=skill+mods.reduce((a,m)=>a+m[1],0);
  target=Math.max(1,target);
  const hit=r===1?true:r===100?false:r<=target;
  const dos=Math.floor(target/10)-Math.floor(r/10);
  let h=`<p><b>Roll:</b> D100 ${r}${virtual?" <small>(virtual)</small>":""} vs ${mode==="m"?"WS":"BS"} ${skill}${mods.filter(m=>m[1]).map(m=>" "+sgn(m[1])+" ("+m[0]+")").join("")} = <b>${target}</b> &rarr; <span class="${hit?"hit":"miss"}">${hit?"HIT":"MISS"}</span></p>`;

  if(mode==="r"){
    const jam=(q==="poor"&&r>=91)||(fire==="a"&&r>=94)||(fire!=="a"&&r>=96&&q!=="best");
    if(jam)h+=`<p class="miss">Weapon jams on this roll (${q==="poor"?"poor quality 91+":fire==="a"?"auto fire 94+":"96+"}). Check your weapon's Reliable / Unreliable traits.</p>`;
  }
  if(!hit){
    h+=`<p>Degrees of failure: ${Math.max(1,Math.floor(r/10)-Math.floor(target/10))}</p>`;
    o.innerHTML=h;return;
  }
  h+=`<p>Degrees of success: ${Math.max(1,dos+1)} &nbsp;|&nbsp; Primary hit location: <b>${loc(r)}</b> <small>(roll reversed: ${r===100?"00":String((r%10)*10+Math.floor(r/10)).padStart(2,"0")})</small></p>`;

  let hits=1;
  if(mode==="r"){
    const rofS=num("rofs"),rofF=num("roff");
    if(fire==="b")hits=Math.max(1,Math.min(rofS,1+Math.floor(Math.max(0,dos)/2)));
    if(fire==="a")hits=Math.max(1,Math.min(rofF,1+Math.max(0,dos)));
    if(fire!=="s")h+=`<p>Hits: <b>${hits}</b> <small>(${fire==="b"?"1 + 1 per 2 DoS":"1 + 1 per DoS"}, max RoF ${fire==="b"?rofS:rofF})</small></p>`;
    if(hits>1)h+=`<p><small>Extra hits: roll each location up the hit table (Head &rarr; Arm &rarr; Body &rarr; Arm &rarr; Body). Hit location of each depends on your GM's ruling.</small></p>`;
  }

  // damage
  const n=num("dn",1),f=num("df",10),k=num("dk"),pen=num("pen"),sb=mode==="m"?num("sb"):0;
  const manual=$("dmg").value.split(/[,\s]+/).filter(Boolean).map(Number).filter(x=>!isNaN(x));
  const tb=num("tb")*num("tbm",1),arm=num("arm");
  const type=$("dmgtype").value;
  h+=`<table><tr><th>#</th><th>Dice</th><th>Dmg</th><th>Armour</th><th>Wounds</th></tr>`;
  let sum=0,rf=false;
  for(let i=0;i<hits;i++){
    let dice=null,total,rfHit=false;
    if(manual.length){total=manual[Math.min(i,manual.length-1)];rfHit=$("rfm").checked&&i===0}
    else{
      dice=[];for(let j=0;j<n;j++)dice.push(d(f));
      total=dice.reduce((a,b)=>a+b,0);rfHit=dice.includes(10);
    }
    const base=total+k+sb;
    const ap=Math.max(0,arm-pen);
    const w=Math.max(0,base-tb-ap);
    sum+=w;if(rfHit)rf=true;
    h+=`<tr><td>${i+1}</td><td>${dice?dice.join("+"):total}${dice?" = "+total:""}${rfHit?" <b>(10!)</b>":""}</td><td>${total}${k?" + "+k:""}${sb?" + "+sb+" SB":""} = <b>${base}</b></td><td>${arm}${pen?" &minus; "+pen+" pen":""} = ${ap}</td><td>${base} &minus; ${tb} TB &minus; ${ap} = <b>${w}</b></td></tr>`;
  }
  h+=`</table><p><b>Total wounds: ${sum}</b> <small>(${type})</small></p>`;
  if(rf)h+=`<p class="hit">Righteous Fury! A damage die showed 10. Roll another D100 to confirm: if it hits, roll one extra damage die and add it.</p>`;
  if(sum>0&&tb===0&&arm===0)h+=`<p><small>Target TB and armour are 0. Enter them for accurate wounds.</small></p>`;
  o.innerHTML=h;
};

const Q=new URLSearchParams(location.search);
function resetForm(){
  ["skill","sb","roll","dmg","tb","arm","cust"].forEach(i=>$(i).value=i==="tb"||i==="arm"||i==="cust"?0:"");
  $("dn").value=1;$("df").value=10;$("dk").value=0;$("pen").value=0;$("dmgtype").value="Impact";
  $("size").value=0;$("range").value=0;$("tbm").value=1;$("rofs").value=3;$("roff").value=6;$("rfm").checked=false;$("qual").value="";
  document.querySelectorAll(".mods input:checked").forEach(c=>c.checked=false);
  [...$("rof").options].forEach(o=>o.disabled=false);
  $("wname").textContent="";document.title="Deathwatch Combat Calculator";
}
function loadWeapon(){
  resetForm();
  const p=mode==="m"?"m_":"r_",get=k=>Q.get(p+k);
  const set=(id,v)=>{if(v!==null&&v!=="")$(id).value=v};
  set("skill",get("skill"));if(mode==="m")set("sb",get("sb"));set("pen",get("pen"));
  const m=/^(\d+)d(\d+)(?:\s*\+\s*(\d+))?\s*\(?([A-Za-z])?\)?/i.exec(get("dmg")||"");
  if(m){set("dn",m[1]);if(m[2]==="5"||m[2]==="10")set("df",m[2]);set("dk",m[3]||0);
    const t={E:"Energy",R:"Rending",X:"Explosive",I:"Impact"}[(m[4]||"I").toUpperCase()];if(t)set("dmgtype",t)}
  if(mode==="r"){
    const rf=(get("rof")||"").split("/").map(v=>parseInt(v));
    if(get("rof")){
      const ok=[rf[0]>0,rf[1]>0,rf[2]>0];
      [...$("rof").options].forEach((o,i)=>o.disabled=!ok[i]);
      $("rof").value=ok[0]?"s":ok[1]?"b":"a";
      if(rf[1]>0)set("rofs",rf[1]);if(rf[2]>0)set("roff",rf[2]);
    }
  }
  if(get("name")){$("wname").textContent="Weapon: "+get("name")+(get("special")?" ("+get("special")+")":"");document.title=get("name")+" - Deathwatch Combat Calculator"}
}
if([...Q.keys()].length){setMode(Q.get("type")==="ranged"?"r":"m");loadWeapon()}
$("tm").addEventListener("click",()=>{if([...Q.keys()].length)loadWeapon()});
$("tr").addEventListener("click",()=>{if([...Q.keys()].length)loadWeapon()});
</script>
</body>
</html>
